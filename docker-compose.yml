# Local only. Run:  docker compose up --build   then open http://localhost:8000/docs
# Secrets come from .env (git-ignored); they are NOT baked into the image.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
      - path: .env.docker         # optional, git-ignored: overrides .env for local Docker
        required: false
    volumes:
      - ./app:/code/app          # edit code locally, reload inside the container
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
